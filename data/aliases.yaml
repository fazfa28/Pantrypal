# Canonical food list. Every module keys on these ids.
# Format:  <canonical_id>: {category: <cat>, aliases: [other names]}
# The id itself (underscores -> spaces) is always an alias; plurals are handled in code.
# Start: Freiburg's 25 classes + common fridge items. Grow this to cover
# FoodKeeper items and the Grocery Store coarse classes.
#
# Categories: dairy, egg, meat, seafood, produce, fruit, grain, bakery,
#             condiment, snack, beverage, baking, plant_protein, other

